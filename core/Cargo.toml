[package]
name = "photorust_core"
version = "0.1.0"
edition = "2021"
description = "Image engine for PhotoRust — pixel buffers, layers, compositing, filters, history, PSD I/O"

# CMake links this into the C++ shell. See the top-level CMakeLists.txt.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "1.0"
cxx-qt = "0.9"
# `qt_gui` pulls in QImage/QColor/QPainter. Do NOT bump this to `qt_full`: it
# drags in Qt Qml, which then has to be listed in QT_MODULES in CMake even
# though this is a QWidgets-only application.
cxx-qt-lib = { version = "0.9", features = ["qt_gui"] }
rayon = "1.10"
# GPU backend. `wgpu` targets Vulkan on Linux and Metal on macOS, which is what
# CLAUDE.md §7 asks for without dragging in MoltenVK by hand. `pollster` drives
# wgpu's async device setup to completion; the engine has no async runtime and
# does not want one, and device init happens once at startup.
wgpu = "30"
pollster = "0.4"
# Safe reinterpretation of the uniform/kernel structs as the byte slices wgpu
# wants, without hand-rolled `unsafe` transmutes.
bytemuck = { version = "1", features = ["derive"] }

[build-dependencies]
cxx-qt-build = "0.9"

[dev-dependencies]
approx = "0.5"

# A debug build of the shell still gets an optimised engine.
#
# Unoptimised, the per-pixel loops here run roughly 10× slower — enough to turn
# a feathered marquee or a large filter into a visible stall while debugging
# the UI, which is exactly when you are least interested in the engine being
# the slow part. Debug assertions and symbols are kept, so `cargo test` and
# breakpoints in the core still behave.
[profile.dev]
opt-level = 2
